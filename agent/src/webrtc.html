<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chameleon Hidden WebRTC Engine</title>
</head>
<body>
    <script>
        const { ipcRenderer } = require('electron');

        let peerConnection = null;
        let localStream = null;
        let dataChannel = null;
        let iceCandidateQueue = [];
        let isRemoteDescriptionSet = false;

        // Start WebRTC when client joins
        ipcRenderer.on('agent:client_joined', async () => {
            console.log('[WebRTC] Client joined. Starting WebRTC...');
            cleanupSession();
            ipcRenderer.send('tray:update_status', 'connected');
            await startWebRTC();
        });

        ipcRenderer.on('signal:sdp', async (event, data) => {
            try {
                if (!peerConnection) return;
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                isRemoteDescriptionSet = true;

                // Process queued ICE candidates
                while (iceCandidateQueue.length > 0) {
                    const candidate = iceCandidateQueue.shift();
                    await peerConnection.addIceCandidate(candidate).catch(e => console.error("Queued ICE error:", e));
                }

                if (data.sdp.type === 'offer') {
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    ipcRenderer.send('webrtc:signal:sdp', {
                        sdp: peerConnection.localDescription,
                        to: 'client'
                    });
                }
            } catch (err) {
                console.error('[WebRTC] SDP Error', err);
            }
        });

        ipcRenderer.on('signal:ice', async (event, data) => {
            try {
                if (data.candidate) {
                    const candidate = new RTCIceCandidate(data.candidate);
                    if (peerConnection && isRemoteDescriptionSet) {
                        await peerConnection.addIceCandidate(candidate);
                    } else {
                        iceCandidateQueue.push(candidate);
                    }
                }
            } catch (err) {
                console.error('[WebRTC] ICE Error', err);
            }
        });

        async function getScreenStream() {
            const sources = await ipcRenderer.invoke('get-desktop-sources');
            const primarySource = sources[0];

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: {
                        mandatory: {
                            chromeMediaSource: 'desktop',
                            chromeMediaSourceId: primarySource.id,
                            minWidth: 1280,
                            maxWidth: 1920,
                            minHeight: 720,
                            maxHeight: 1080,
                            maxFrameRate: 60
                        }
                    }
                });
                return stream;
            } catch (e) {
                console.error('Capture error', e);
                return null;
            }
        }

        async function startWebRTC() {
            localStream = await getScreenStream();
            if (!localStream) {
                console.error("Failed to get screen stream");
                return;
            }

            peerConnection = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:443' },
                    {
                        urls: 'turn:openrelay.metered.ca:443',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ]
            });

            localStream.getTracks().forEach(track => {
                if (track.kind === 'video') {
                    track.contentHint = 'motion';
                }
                peerConnection.addTrack(track, localStream);
            });

            dataChannel = peerConnection.createDataChannel('control');
            setupDataChannel(dataChannel);

            peerConnection.ondatachannel = (event) => {
                setupDataChannel(event.channel);
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    ipcRenderer.send('webrtc:signal:ice', {
                        candidate: event.candidate,
                        to: 'client'
                    });
                }
            };

            peerConnection.onconnectionstatechange = () => {
                console.log('[WebRTC] State:', peerConnection.connectionState);
                if (peerConnection.connectionState === 'failed' || peerConnection.connectionState === 'disconnected') {
                    console.log('[WebRTC] Connection failed or disconnected. Attempting ICE restart...');
                    // ICE Restart logic
                    if (peerConnection.connectionState === 'failed') {
                        peerConnection.restartIce();
                    }
                }
            };

            // Create Offer
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            ipcRenderer.send('webrtc:signal:sdp', {
                sdp: peerConnection.localDescription,
                to: 'client'
            });
        }

        function setupDataChannel(channel) {
            channel.onopen = () => console.log('Data channel opened');
            channel.onclose = () => console.log('Data channel closed');
            channel.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'ping' || data.type === 'pong') return;
                    
                    if (data.type === 'clipboard_pull_request') {
                        ipcRenderer.invoke('webrtc:clipboard_pull').then(text => {
                            if (channel && channel.readyState === 'open') {
                                channel.send(JSON.stringify({ type: 'clipboard_pull_response', text }));
                            }
                        }).catch(err => console.error("Agent clipboard read error", err));
                    } else if (data.type === 'update_resolution') {
                        updateResolution(data.resolution);
                    } else {
                        ipcRenderer.send('webrtc:remote_input', data);
                    }
                } catch (e) {
                    console.error('DataChannel parse error', e);
                }
            };
        }

        async function updateResolution(res) {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (!videoTrack) return;

            let width = 1920; let height = 1080; let fps = 60;
            if (res === '720p') { width = 1280; height = 720; fps = 30; }
            if (res === '480p') { width = 854; height = 480; fps = 30; }

            try {
                await videoTrack.applyConstraints({ width: { max: width }, height: { max: height }, frameRate: { max: fps } });
            } catch (err) {
                console.error('Failed to apply constraints', err);
            }
        }

        function cleanupSession() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            isRemoteDescriptionSet = false;
            iceCandidateQueue = [];
            ipcRenderer.send('tray:update_status', 'idle');
        }
    </script>
</body>
</html>
