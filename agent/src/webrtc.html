<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Chameleon Background Process</title>
</head>

<body>
    <script>
        // We use nodeIntegration here to easily access DesktopCapturer and Socket.io in MVP
        const { ipcRenderer } = require('electron');
        const { io } = require('socket.io-client');
        const QRCode = require('qrcode');

        const SIGNALING_URL = 'https://chameleon-j5wf.onrender.com';

        // Keep-alive for Render backend (Prevents 15m idle shutdown and RAM wipe)
        setInterval(() => {
            fetch(`${SIGNALING_URL}/ping`).catch(() => { });
        }, 5 * 60 * 1000);
        fetch(`${SIGNALING_URL}/ping`).catch(() => { }); // Initial warm-up

        let socket = null;
        let peerConnection = null;
        let localStream = null;
        let currentSessionId = null;
        let dataChannel = null;
        let iceCandidateQueue = [];
        let isRemoteDescriptionSet = false;

        // Initialize connection
        function initSignaling() {
            if (socket) socket.disconnect();

            socket = io(SIGNALING_URL);

            socket.on('connect', () => {
                console.log('Background connected to signaling server');
            });

            socket.on('agent:session_created', async (data) => {
                currentSessionId = data.sessionId;
                const qrUrl = `https://chameleon-jet.vercel.app/?sess=${data.sessionId}`;

                try {
                    const qrDataUrl = await QRCode.toDataURL(qrUrl, { margin: 2, color: { dark: '#0f172a', light: '#ffffff' } });
                    ipcRenderer.send('webrtc:qr_payload', {
                        sessionId: data.sessionId,
                        dataUrl: qrDataUrl,
                        expiresIn: data.expiresIn
                    });
                    ipcRenderer.send('tray:update_status', 'pairing');
                } catch (e) {
                    console.error('Failed to generate QR code', e);
                }
            });

            socket.on('agent:client_joined', async (data) => {
                console.log('Client joined session:', data.sessionId);
                currentSessionId = data.sessionId;
                ipcRenderer.send('tray:update_status', 'connected');
                await startWebRTC();
            });

            socket.on('session:expired', () => {
                console.log('Session expired');
                currentSessionId = null;
                ipcRenderer.send('tray:update_status', 'idle');
            });

            socket.on('session:ended', () => {
                console.log('Session ended');
                cleanupSession();
            });

            socket.on('signal:sdp', async (data) => {
                try {
                    if (!peerConnection) return;
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    isRemoteDescriptionSet = true;

                    // Process queued ICE candidates
                    while (iceCandidateQueue.length > 0) {
                        const candidate = iceCandidateQueue.shift();
                        await peerConnection.addIceCandidate(candidate).catch(e => console.error("Queued ICE error:", e));
                    }

                    if (data.sdp.type === 'offer') {
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        socket.emit('signal:sdp', {
                            sessionId: currentSessionId,
                            sdp: peerConnection.localDescription,
                            to: 'client'
                        });
                    }
                } catch (err) {
                    console.error('SDP Error', err);
                }
            });

            socket.on('signal:ice', async (data) => {
                try {
                    if (data.candidate) {
                        const candidate = new RTCIceCandidate(data.candidate);
                        if (peerConnection && isRemoteDescriptionSet) {
                            await peerConnection.addIceCandidate(candidate);
                        } else {
                            console.log('Queueing ICE candidate...');
                            iceCandidateQueue.push(candidate);
                        }
                    }
                } catch (err) {
                    console.error('ICE Error', err);
                }
            });
        }

        async function getScreenStream() {
            const sources = await ipcRenderer.invoke('get-desktop-sources');
            const primarySource = sources[0]; // Just grab first screen for MVP

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: {
                        mandatory: {
                            chromeMediaSource: 'desktop',
                            chromeMediaSourceId: primarySource.id,
                            minWidth: 1280,
                            maxWidth: 1920,
                            minHeight: 720,
                            maxHeight: 1080,
                            maxFrameRate: 60
                        }
                    }
                });
                return stream;
            } catch (e) {
                console.error('Capture error', e);
                return null;
            }
        }

        async function startWebRTC() {
            localStream = await getScreenStream();
            if (!localStream) {
                console.error("Failed to get screen stream");
                return;
            }

            peerConnection = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun.cloudflare.com:3478' },
                    { urls: 'stun:global.stun.twilio.com:3478' },
                    {
                        urls: 'turn:openrelay.metered.ca:80',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:443',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ]
            });

            // Add video track
            localStream.getTracks().forEach(track => {
                if (track.kind === 'video') {
                    track.contentHint = 'motion'; // Prioritize strict framerate over single-frame clarity
                }
                peerConnection.addTrack(track, localStream);
            });

            // Create DataChannel for receiving input
            dataChannel = peerConnection.createDataChannel('control');
            setupDataChannel(dataChannel);

            peerConnection.ondatachannel = (event) => {
                setupDataChannel(event.channel);
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal:ice', {
                        sessionId: currentSessionId,
                        candidate: event.candidate,
                        to: 'client'
                    });
                }
            };

            peerConnection.onconnectionstatechange = () => {
                console.log('PC State:', peerConnection.connectionState);
                if (peerConnection.connectionState === 'failed') {
                    console.log('WebRTC Connection failed. Cleaning up.');
                    cleanupSession();
                }
            };

            // Create Offer
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            socket.emit('signal:sdp', {
                sessionId: currentSessionId,
                sdp: peerConnection.localDescription,
                to: 'client'
            });
        }

        function setupDataChannel(channel) {
            channel.onopen = () => {
                console.log('Data channel opened');
                // Keep the NAT binding alive aggressively
                channel.pingInterval = setInterval(() => {
                    if (channel.readyState === 'open') {
                        channel.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 5000); // 5 seconds
            };

            channel.onclose = () => {
                console.log('Data channel closed');
                if (channel.pingInterval) clearInterval(channel.pingInterval);
            };

            channel.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'ping' || data.type === 'pong') return; // Ignore keep-alives
                    handleRemoteInput(data);
                } catch (e) {
                    console.error('DataChannel parse error', e);
                }
            };
        }

        function handleRemoteInput(data) {
            if (data.type === 'clipboard_pull_request') {
                ipcRenderer.invoke('webrtc:clipboard_pull').then(text => {
                    if (dataChannel && dataChannel.readyState === 'open') {
                        dataChannel.send(JSON.stringify({ type: 'clipboard_pull_response', text }));
                    }
                }).catch(err => console.error("Agent clipboard read error", err));
            } else if (data.type === 'update_resolution') {
                updateResolution(data.resolution);
            } else {
                ipcRenderer.send('webrtc:remote_input', data);
            }
        }

        async function updateResolution(res) {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (!videoTrack) return;

            // Chrome desktopCapture has specific constraints format requirements
            let width = 1920;
            let height = 1080;
            let fps = 60;

            if (res === '720p') { width = 1280; height = 720; fps = 30; }
            if (res === '480p') { width = 854; height = 480; fps = 30; }

            try {
                // Apply constraints to running track seamlessly without renegotiation
                await videoTrack.applyConstraints({
                    width: { max: width },
                    height: { max: height },
                    frameRate: { max: fps }
                });
                console.log('Applied new constraints:', res);
            } catch (err) {
                console.error('Failed to apply constraints', err);
            }
        }

        function cleanupSession() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            currentSessionId = null;
            isRemoteDescriptionSet = false;
            iceCandidateQueue = [];
            ipcRenderer.send('tray:update_status', 'idle');
        }

        // IPC Listeners
        ipcRenderer.on('session:request_pairing', () => {
            if (!socket) initSignaling();
            if (!socket.connected) {
                socket.connect();
            }
            socket.emit('agent:create_session');
        });

        ipcRenderer.on('session:disconnect', () => {
            if (socket && currentSessionId) {
                // Let server know we dropped
                socket.disconnect();
                socket.connect(); // reconnect cleanly
            }
            cleanupSession();
        });

        // Initialize socket on boot
        initSignaling();
    </script>
</body>

</html>
