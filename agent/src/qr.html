<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Service Host</title>
    <!-- Use Tailwind via CDN for quick MVP UI styling here, or simple CSS -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background: #1e293b;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            width: 300px;
        }

        h2 {
            margin-top: 0;
            color: #38bdf8;
        }

        #qr-img {
            display: none;
            margin: 1rem auto;
            background: white;
            padding: 10px;
            border-radius: 8px;
            width: 200px;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 2rem auto;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .timer {
            font-weight: bold;
            color: #facc15;
        }

        .success-text {
            color: #4ade80;
            display: none;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Pair Device</h2>
        <p>Scan this QR to connect remotely</p>

        <div id="otp-container" style="margin: 1.5rem 0;">
            <p style="font-size: 0.8rem; text-transform: uppercase;">Or enter code</p>
            <div id="otp-code"
                style="font-size: 2.5rem; font-weight: bold; letter-spacing: 0.25em; color: #f8fafc; margin-top: 0.5rem; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);">
                ------</div>
        </div>

        <div id="qr-spinner" class="spinner"></div>
        <img id="qr-img" alt="QR Code" />

        <p id="timer-text">Expires in <span class="timer" id="timer">--</span></p>
        <div id="success-msg" class="success-text">Connected Successfully!</div>

        <div style="margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid #334155;">
            <button id="login-btn" onclick="handleDesktopLogin()" style="width: 100%; padding: 0.65rem 1rem; background: linear-gradient(135deg, #06b6d4, #2563eb); color: white; border: none; border-radius: 0.5rem; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: all 0.2s;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                <span>Link PC to Account</span>
            </button>
            <p id="auth-status-msg" style="font-size: 0.75rem; margin-top: 0.5rem; color: #38bdf8; display: none; text-align: center;"></p>
        </div>
    </div>

    <script>
        let countdownInterval;

        window.electronAPI.onQRCodeData(({ sessionId, dataUrl, expiresIn }) => {
            const img = document.getElementById('qr-img');
            const spinner = document.getElementById('qr-spinner');

            // Set OTP Code
            document.getElementById('otp-code').innerText = sessionId;

            // Set QR Image URL
            img.src = dataUrl || `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent('https://chameleon-jet.vercel.app/?sess=' + sessionId)}&size=200x200`;
            img.style.display = 'block';
            if (spinner) spinner.style.display = 'none';

            // Start countdown
            const timerEl = document.getElementById('timer');
            const timerText = document.getElementById('timer-text');
            
            if (expiresIn === 0) {
                timerText.innerText = "Permanent Code (No Expiration)";
                timerText.style.color = "#4ade80"; // green text
                clearInterval(countdownInterval);
            } else {
                let timeLeft = expiresIn || 7200;

                const formatTime = (seconds) => {
                    const h = Math.floor(seconds / 3600);
                    const m = Math.floor((seconds % 3600) / 60);
                    const s = seconds % 60;
                    if (h > 0) return `${h}h ${m}m ${s}s`;
                    if (m > 0) return `${m}m ${s}s`;
                    return `${s}s`;
                };

                timerEl.innerText = formatTime(timeLeft);

                clearInterval(countdownInterval);
                countdownInterval = setInterval(() => {
                    timeLeft -= 1;
                    timerEl.innerText = formatTime(timeLeft);
                    if (timeLeft <= 0) {
                        clearInterval(countdownInterval);
                        timerEl.innerText = "0";
                        window.electronAPI.closeQRWindow(); // Auto close when expired
                    }
                }, 1000);
            }
        });

        window.electronAPI.onConnectionStatus((status) => {
            if (status === 'connected') {
                document.getElementById('qr-img').style.opacity = '0.2';
                document.getElementById('timer-text').style.display = 'none';
                document.getElementById('success-msg').style.display = 'block';
                clearInterval(countdownInterval);
                setTimeout(() => window.electronAPI.closeQRWindow(), 2000);
            } else if (status === 'disconnected') {
                window.electronAPI.closeQRWindow();
            }
        });

        async function handleDesktopLogin() {
            const btn = document.getElementById('login-btn');
            const msg = document.getElementById('auth-status-msg');
            btn.disabled = true;
            btn.style.opacity = '0.6';
            msg.style.display = 'block';
            msg.innerText = 'Opening browser to complete sign-in...';
            try {
                const res = await window.electronAPI.startDeviceLogin();
                if (res && res.success) {
                    msg.innerText = `Approve code ${res.userCode} in browser...`;
                } else {
                    msg.innerText = (res && res.error) || 'Failed to start device login';
                    btn.disabled = false;
                    btn.style.opacity = '1';
                }
            } catch (e) {
                msg.innerText = 'Error launching authorization flow';
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }
    </script>
</body>

</html>
